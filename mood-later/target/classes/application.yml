server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mood?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

upload:
  path: e:/微信小程序课设/uploads

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.moodlater.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: moodlater-secret-key-2026
  expiration: 3600000

